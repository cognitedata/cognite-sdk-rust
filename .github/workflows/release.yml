name: Release to crates.io

on:
  push:
    branches:
      - master

jobs:
  common:
    uses: ./.github/workflows/common.yml
    secrets: inherit
  release:
    runs-on: ubuntu-latest
    needs: common
    environment: CD
    if: ${{ needs.common.outputs.should-release == 0 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        # toolchain: --> see rust-toolchain.toml

      - name: Create tag
        uses: rickstaa/action-create-tag@v1
        id: "tag_create"
        with:
          tag: v${{ needs.common.outputs.version }}
          tag_exists_error: true
          message: Cognite SDK version ${{ needs.common.outputs.version }}

      - name: Create github release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.common.outputs.version }}
          generate_release_notes: true

      - name: Publish
        run: cargo publish --package cognite-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_CARGO_REGISTRY_TOKEN }}
